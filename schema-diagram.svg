<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">MediBook database schema</title>
  <desc id="description">Entity relationship diagram for the patients, doctors, and appointments tables. Patients and doctors each have a one-to-many relationship with appointments.</desc>
  <defs>
    <style>
      .page{fill:#f5f7fa}.card{fill:#fff;stroke:#d6dee7;stroke-width:2}.header{fill:#2f668d}.header-text{font:700 24px Arial,sans-serif;fill:#fff}.subhead{font:14px Arial,sans-serif;fill:#dceaf4}.body{font:16px Arial,sans-serif;fill:#263746}.muted{font:14px Arial,sans-serif;fill:#607080}.field{font:15px 'Courier New',monospace;fill:#243746}.type{font:14px 'Courier New',monospace;fill:#526578}.rule{font:700 12px Arial,sans-serif;fill:#fff}.rule-bg{fill:#496779}.rule-key{fill:#26714f}.rule-check{fill:#8a6821}.divider{stroke:#e7ecf0;stroke-width:1}.edge{fill:none;stroke:#8498a8;stroke-width:2.5}.edge-label{font:700 14px Arial,sans-serif;fill:#536979}.note-title{font:700 18px Arial,sans-serif;fill:#203c50}.note{font:15px Arial,sans-serif;fill:#344b5d}.small{font:13px Arial,sans-serif;fill:#617487}
    </style>
  </defs>
  <rect class="page" width="1600" height="1120"/>
  <text x="70" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183b53">MediBook — database schema</text>
  <text x="70" y="88" class="muted">Three normalized tables · MySQL 8 · primary keys, foreign keys, and booking rules</text>

  <!-- Relationships are drawn behind the table cards. -->
  <path class="edge" d="M630 258 H735 V330 H850"/>
  <path class="edge" d="M630 650 H765 V368 H850"/>
  <text x="648" y="247" class="edge-label">1</text>
  <text x="804" y="320" class="edge-label">0..N</text>
  <text x="648" y="638" class="edge-label">1</text>
  <text x="804" y="358" class="edge-label">0..N</text>

  <!-- patients -->
  <g>
    <rect class="card" x="70" y="155" width="560" height="315" rx="10"/>
    <path class="header" d="M80 155h540a10 10 0 0 1 10 10v54H70v-54a10 10 0 0 1 10-10z"/>
    <text x="94" y="190" class="header-text">patients</text>
    <text x="94" y="211" class="subhead">People who book clinic appointments</text>
    <text x="94" y="258" class="field">patient_id</text><text x="292" y="258" class="type">BIGINT UNSIGNED</text><rect x="493" y="241" width="34" height="22" rx="4" class="rule-key"/><text x="501" y="257" class="rule">PK</text><rect x="533" y="241" width="32" height="22" rx="4" class="rule-bg"/><text x="540" y="257" class="rule">AI</text><rect x="571" y="241" width="34" height="22" rx="4" class="rule-bg"/><text x="579" y="257" class="rule">NN</text>
    <line x1="90" y1="274" x2="610" y2="274" class="divider"/>
    <text x="94" y="300" class="field">full_name</text><text x="292" y="300" class="type">VARCHAR(120)</text><rect x="571" y="283" width="34" height="22" rx="4" class="rule-bg"/><text x="579" y="299" class="rule">NN</text>
    <line x1="90" y1="316" x2="610" y2="316" class="divider"/>
    <text x="94" y="342" class="field">email</text><text x="292" y="342" class="type">VARCHAR(255)</text><rect x="493" y="325" width="34" height="22" rx="4" class="rule-key"/><text x="501" y="341" class="rule">UQ</text><rect x="571" y="325" width="34" height="22" rx="4" class="rule-bg"/><text x="579" y="341" class="rule">NN</text>
    <line x1="90" y1="358" x2="610" y2="358" class="divider"/>
    <text x="94" y="384" class="field">phone</text><text x="292" y="384" class="type">VARCHAR(30)</text><rect x="571" y="367" width="34" height="22" rx="4" class="rule-bg"/><text x="579" y="383" class="rule">NN</text>
    <line x1="90" y1="400" x2="610" y2="400" class="divider"/>
    <text x="94" y="426" class="field">created_at</text><text x="292" y="426" class="type">TIMESTAMP</text><rect x="571" y="409" width="34" height="22" rx="4" class="rule-bg"/><text x="579" y="425" class="rule">NN</text>
    <text x="94" y="453" class="small">DEFAULT CURRENT_TIMESTAMP</text>
  </g>

  <!-- doctors -->
  <g>
    <rect class="card" x="70" y="550" width="560" height="340" rx="10"/>
    <path class="header" d="M80 550h540a10 10 0 0 1 10 10v54H70v-54a10 10 0 0 1 10-10z"/>
    <text x="94" y="585" class="header-text">doctors</text>
    <text x="94" y="606" class="subhead">Doctors and their consultation details</text>
    <text x="94" y="650" class="field">doctor_id</text><text x="292" y="650" class="type">BIGINT UNSIGNED</text><rect x="493" y="633" width="34" height="22" rx="4" class="rule-key"/><text x="501" y="649" class="rule">PK</text><rect x="533" y="633" width="32" height="22" rx="4" class="rule-bg"/><text x="540" y="649" class="rule">AI</text><rect x="571" y="633" width="34" height="22" rx="4" class="rule-bg"/><text x="579" y="649" class="rule">NN</text>
    <line x1="90" y1="666" x2="610" y2="666" class="divider"/>
    <text x="94" y="692" class="field">full_name</text><text x="292" y="692" class="type">VARCHAR(120)</text><rect x="571" y="675" width="34" height="22" rx="4" class="rule-bg"/><text x="579" y="691" class="rule">NN</text>
    <line x1="90" y1="708" x2="610" y2="708" class="divider"/>
    <text x="94" y="734" class="field">specialty</text><text x="292" y="734" class="type">VARCHAR(100)</text><rect x="571" y="717" width="34" height="22" rx="4" class="rule-bg"/><text x="579" y="733" class="rule">NN</text>
    <line x1="90" y1="750" x2="610" y2="750" class="divider"/>
    <text x="94" y="776" class="field">consultation_fee</text><text x="292" y="776" class="type">DECIMAL(10,2)</text><rect x="493" y="759" width="34" height="22" rx="4" class="rule-check"/><text x="501" y="775" class="rule">CK</text><rect x="571" y="759" width="34" height="22" rx="4" class="rule-bg"/><text x="579" y="775" class="rule">NN</text>
    <line x1="90" y1="792" x2="610" y2="792" class="divider"/>
    <text x="94" y="818" class="field">room</text><text x="292" y="818" class="type">VARCHAR(30)</text><rect x="571" y="801" width="34" height="22" rx="4" class="rule-bg"/><text x="579" y="817" class="rule">NN</text>
    <line x1="90" y1="834" x2="610" y2="834" class="divider"/>
    <text x="94" y="860" class="field">created_at</text><text x="292" y="860" class="type">TIMESTAMP</text><rect x="571" y="843" width="34" height="22" rx="4" class="rule-bg"/><text x="579" y="859" class="rule">NN</text>
    <text x="94" y="883" class="small">CHECK consultation_fee &gt;= 0 · DEFAULT CURRENT_TIMESTAMP</text>
  </g>

  <!-- appointments -->
  <g>
    <rect class="card" x="850" y="155" width="680" height="735" rx="10"/>
    <path class="header" d="M860 155h660a10 10 0 0 1 10 10v54H850v-54a10 10 0 0 1 10-10z"/>
    <text x="874" y="190" class="header-text">appointments</text>
    <text x="874" y="211" class="subhead">Bookings and retained cancellation/refund history</text>
    <text x="874" y="254" class="field">appointment_id</text><text x="1092" y="254" class="type">BIGINT UNSIGNED</text><rect x="1390" y="237" width="34" height="22" rx="4" class="rule-key"/><text x="1398" y="253" class="rule">PK</text><rect x="1430" y="237" width="32" height="22" rx="4" class="rule-bg"/><text x="1437" y="253" class="rule">AI</text><rect x="1468" y="237" width="34" height="22" rx="4" class="rule-bg"/><text x="1476" y="253" class="rule">NN</text>
    <line x1="870" y1="270" x2="1510" y2="270" class="divider"/>
    <text x="874" y="292" class="field">appointment_ref</text><text x="1092" y="292" class="type">VARCHAR(20)</text><rect x="1390" y="275" width="34" height="22" rx="4" class="rule-key"/><text x="1398" y="291" class="rule">UQ</text><rect x="1468" y="275" width="34" height="22" rx="4" class="rule-bg"/><text x="1476" y="291" class="rule">NN</text>
    <line x1="870" y1="308" x2="1510" y2="308" class="divider"/>
    <text x="874" y="330" class="field">patient_id</text><text x="1092" y="330" class="type">BIGINT UNSIGNED</text><rect x="1390" y="313" width="34" height="22" rx="4" class="rule-key"/><text x="1398" y="329" class="rule">FK</text><rect x="1468" y="313" width="34" height="22" rx="4" class="rule-bg"/><text x="1476" y="329" class="rule">NN</text>
    <line x1="870" y1="346" x2="1510" y2="346" class="divider"/>
    <text x="874" y="368" class="field">doctor_id</text><text x="1092" y="368" class="type">BIGINT UNSIGNED</text><rect x="1390" y="351" width="34" height="22" rx="4" class="rule-key"/><text x="1398" y="367" class="rule">FK</text><rect x="1468" y="351" width="34" height="22" rx="4" class="rule-bg"/><text x="1476" y="367" class="rule">NN</text>
    <line x1="870" y1="384" x2="1510" y2="384" class="divider"/>
    <text x="874" y="406" class="field">appointment_datetime</text><text x="1092" y="406" class="type">DATETIME</text><rect x="1468" y="389" width="34" height="22" rx="4" class="rule-bg"/><text x="1476" y="405" class="rule">NN</text>
    <line x1="870" y1="422" x2="1510" y2="422" class="divider"/>
    <text x="874" y="444" class="field">booked_at</text><text x="1092" y="444" class="type">DATETIME</text><rect x="1468" y="427" width="34" height="22" rx="4" class="rule-bg"/><text x="1476" y="443" class="rule">NN</text><text x="1200" y="444" class="small">DEFAULT CURRENT_TIMESTAMP</text>
    <line x1="870" y1="460" x2="1510" y2="460" class="divider"/>
    <text x="874" y="482" class="field">amount_paid</text><text x="1092" y="482" class="type">DECIMAL(10,2)</text><rect x="1390" y="465" width="34" height="22" rx="4" class="rule-check"/><text x="1398" y="481" class="rule">CK</text><rect x="1468" y="465" width="34" height="22" rx="4" class="rule-bg"/><text x="1476" y="481" class="rule">NN</text>
    <line x1="870" y1="498" x2="1510" y2="498" class="divider"/>
    <text x="874" y="520" class="field">status</text><text x="1092" y="520" class="type">ENUM(confirmed,cancelled)</text><rect x="1468" y="503" width="34" height="22" rx="4" class="rule-bg"/><text x="1476" y="519" class="rule">NN</text>
    <line x1="870" y1="536" x2="1510" y2="536" class="divider"/>
    <text x="874" y="558" class="field">cancelled_at</text><text x="1092" y="558" class="type">DATETIME NULL</text>
    <line x1="870" y1="574" x2="1510" y2="574" class="divider"/>
    <text x="874" y="596" class="field">refund_amount</text><text x="1092" y="596" class="type">DECIMAL(10,2)</text><rect x="1390" y="579" width="34" height="22" rx="4" class="rule-check"/><text x="1398" y="595" class="rule">CK</text><rect x="1468" y="579" width="34" height="22" rx="4" class="rule-bg"/><text x="1476" y="595" class="rule">NN</text>
    <line x1="870" y1="612" x2="1510" y2="612" class="divider"/>
    <text x="874" y="634" class="field">active_doctor_id</text><text x="1092" y="634" class="type">BIGINT UNSIGNED</text><rect x="1390" y="617" width="92" height="22" rx="4" class="rule-bg"/><text x="1398" y="633" class="rule">GENERATED</text>
    <text x="874" y="669" class="small">GENERATED STORED · NULLABLE · doctor_id while confirmed; NULL after cancellation</text>
    <line x1="870" y1="688" x2="1510" y2="688" class="divider"/>
    <text x="874" y="718" class="note-title">Appointment constraints</text>
    <text x="874" y="747" class="note">UNIQUE(appointment_ref)</text>
    <text x="874" y="773" class="note">UNIQUE(active_doctor_id, appointment_datetime) prevents duplicate active slots.</text>
    <text x="874" y="799" class="note">Foreign keys to patients and doctors use ON UPDATE/DELETE RESTRICT.</text>
    <text x="874" y="825" class="note">CHECK: 09:00–16:30, :00 or :30, with zero seconds.</text>
    <text x="874" y="851" class="note">CHECK: amount_paid &gt;= 0; 0 &lt;= refund_amount &lt;= amount_paid.</text>
    <text x="874" y="876" class="small">CHECK: confirmed rows have no cancellation/refund; cancelled rows retain cancellation time.</text>
  </g>

  <!-- Assignment rules that span more than one table. -->
  <g>
    <rect x="70" y="935" width="1460" height="170" rx="10" fill="#eaf0f5" stroke="#d0dce6" stroke-width="2"/>
    <text x="94" y="970" class="note-title">Where the remaining booking rules are enforced</text>
    <text x="94" y="1002" class="note">A transaction locks the doctor row before counting confirmed appointments, keeping each doctor to 12 appointments per day.</text>
    <text x="94" y="1031" class="note">The API accepts only future appointment times. Defaults: status confirmed, refund 0, and timestamps set automatically.</text>
    <text x="94" y="1057" class="small">Redis holds waitlists and notification jobs outside MySQL. Cancelled rows retain refund history and free the slot.</text>
    <text x="94" y="1083" class="small">Patients 1 → many appointments · Doctors 1 → many appointments · Each appointment belongs to one patient and one doctor.</text>
  </g>
</svg>
